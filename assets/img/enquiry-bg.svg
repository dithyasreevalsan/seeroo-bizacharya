<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" preserveAspectRatio="xMidYMid slice" role="presentation" aria-hidden="true">
  <defs>
    <pattern id="enqCross" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M7 1v12M1 7h12" stroke="#07579A" stroke-opacity="0.13" stroke-width="1.4" stroke-linecap="round"/>
    </pattern>
    <radialGradient id="enqFadeGrad" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.65" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="enqFadeMask">
      <rect width="480" height="480" fill="url(#enqFadeGrad)"/>
    </mask>
  </defs>

  <!-- sparse plus-mark grid, fading out toward the edges -->
  <rect width="480" height="480" fill="url(#enqCross)" mask="url(#enqFadeMask)"/>

  <!-- two short accent lines meeting a single node -->
  <g fill="none" stroke-linecap="round">
    <path d="M40 440 L 130 350" stroke="#1A9A8C" stroke-opacity="0.18" stroke-width="1.5"/>
    <path d="M60 460 L 170 350" stroke="#07579A" stroke-opacity="0.14" stroke-width="1.5"/>
  </g>
  <g fill="#1A9A8C">
    <circle cx="130" cy="350" r="3.5" fill-opacity="0.3"/>
  </g>
</svg>
